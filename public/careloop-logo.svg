<svg viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CareLoop Continuous Loop of Care Mark -->
  <defs>
    <linearGradient id="careloop-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E6156" />
      <stop offset="50%" stop-color="#09473F" />
      <stop offset="100%" stop-color="#06312B" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="36" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <rect x="4" y="4" width="32" height="32" rx="10" fill="url(#careloop-gradient)" filter="url(#shadow)" stroke="#0E6156" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Continuous Loop of Care Path -->
  <g transform="translate(4, 4)">
    <!-- Primary Outer Arc -->
    <path
      d="M9 16C9 12.134 12.134 9 16 9C19.866 9 23 12.134 23 16C23 19.866 19.866 23 16 23"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <!-- Inner Guided Dash Loop -->
    <path
      d="M16 23C13.2386 23 11 20.7614 11 18C11 15.2386 13.2386 13 16 13C18.7614 13 21 15.2386 21 18C21 20.7614 18.7614 23 16 23Z"
      stroke="#99F6E4"
      stroke-width="2"
      stroke-dasharray="2 3"
    />
    <!-- Care Milestones / Nodes -->
    <circle cx="16" cy="9" r="2.2" fill="#5EEAD4" />
    <circle cx="23" cy="16" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Wordmark: CareLoop -->
  <text x="46" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5px" fill="#0F172A">
    Care<tspan fill="#0E6156" font-weight="300">Loop</tspan>
  </text>
</svg>
